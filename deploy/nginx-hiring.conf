# Nginx server block for the HireFlow hiring app.
#
# This is a template: replace every <PLACEHOLDER> before use, then install with:
#   sudo cp deploy/nginx-hiring.conf /etc/nginx/sites-available/hiring
#   sudo ln -s /etc/nginx/sites-available/hiring /etc/nginx/sites-enabled/hiring
#   sudo nginx -t && sudo systemctl reload nginx
#
# Access pattern: http://<VPS_IP>:<FRONTEND_PORT>
#   - Static frontend build is served directly by Nginx.
#   - /api/ requests are reverse-proxied to the PM2-managed backend on 127.0.0.1:<BACKEND_PORT>.
#
# Pick <FRONTEND_PORT> and <BACKEND_PORT> so they don't collide with ports already
# used by other sites/apps on this VPS. Check with: sudo ss -tulpn | grep LISTEN

server {
    listen <FRONTEND_PORT>;
    listen [::]:<FRONTEND_PORT>;

    server_name _;

    # Path to the built frontend (frontend/dist after `npm run build`)
    root <REPO_PATH>/frontend/dist;
    index index.html;

    # Allow resume/file uploads up to backend's MAX_FILE_SIZE_MB (+ some headroom)
    client_max_body_size 15M;

    # Reverse proxy API requests to the backend PM2 process.
    # Keep the trailing slashes on both sides so the /api prefix is preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:<BACKEND_PORT>/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health check (mounted at /health, not under /api/v1 -- see backend/src/app.ts)
    location /health {
        proxy_pass http://127.0.0.1:<BACKEND_PORT>/health;
        proxy_set_header Host $host;
    }

    # Serve uploaded files (resumes etc.) directly if the backend writes them
    # to a directory Nginx can read. Adjust/remove if uploads should stay
    # behind the authenticated API instead.
    location /uploads/ {
        alias <REPO_PATH>/backend/uploads/;
    }

    # SPA fallback: any non-file, non-API route goes to index.html so
    # react-router-dom client-side routing works on page refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/hiring.access.log;
    error_log  /var/log/nginx/hiring.error.log;
}
