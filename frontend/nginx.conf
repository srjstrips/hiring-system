# Nginx config baked into the frontend image (see frontend/Dockerfile).
# Runs inside the Docker network, so it proxies to the "backend" service by
# name (Docker's internal DNS) rather than 127.0.0.1 or a host port.
#
# The backend's internal container port is fixed at 5000 (set via PORT=5000
# in docker-compose.yml's backend service -- not published to the host, so
# there's no collision risk with other apps on the VPS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
    }

    # SPA fallback so react-router-dom client-side routes survive refresh/deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}
